const crewSize=4;

const constructionCost=def=>({...def.cost,gold:Math.ceil(def.cost.gold*0.8)});

const key='niemeng-kingdom-v1';
const views=['map','build','castle','throne'];
let workspace='map', affordableOnly=false, repeatBuild=false;
function setWorkspace(view){
 const next=views.includes(view)?view:'map';
 if(next!==workspace){
  if(next!=='build')plan=null;
  if(next!=='castle')relocating=null;
 }
 workspace=next;
 render();
}
function syncWorkspace(){
 setWorkspace(location.hash.slice(1));
}
function renderWorkspace(){
 const land=$('land-workspace');
 land.hidden=workspace==='castle'||workspace==='throne';
 land.className='layout workspace'+(workspace==='build'?' build-layout':'');
 $('catalog-panel').hidden=workspace!=='build';
 $('castle-workspace').hidden=workspace!=='castle';
 $('throne-workspace').hidden=workspace!=='throne';
 if(typeof document.querySelectorAll==='function'){
  for(const link of document.querySelectorAll('[data-view]')){
   if(link.dataset.view===workspace)link.setAttribute('aria-current','page');
   else link.removeAttribute('aria-current');
  }
 }
}
let state=fresh(),persistent=true;
try{const saved=localStorage.getItem(key);if(saved)state=JSON.parse(saved)}catch{persistent=false}
state.stock.happiness??=0;
state.people.hero.mood=100;
const priorRoyalWork=state.people.hero.job;
state.labor??={morale:85,royalSite:catalog[state.tiles[priorRoyalWork]?.type]?.yield?priorRoyalWork:null,mode:'supervise'};
state.people.hero.job=null;
const pressureCost=12;
const lowMorale=40;
const moralePenalty=2;
const relief=25;
const royalYield={supervise:1,pressure:3};
const adjustMorale=amount=>{state.labor.morale=Math.max(0,Math.min(100,state.labor.morale+amount))};

let selected=null,plan=null,group='生产',person='hero',message='从顶部打开建造手册，选择建筑，再点击空地。';
const people={hero:{name:'国王聂萌',icon:'👸🏻',gift:'treat',line:'先让每家都有灯、有粮。国库的金子，花在臣民身上才有分量。'},advisor:{name:'宰相刘博文',icon:'📜',gift:'treat',line:'陛下尽管开口。粮仓、工坊和国库，臣都记着。陛下已经看出了方案的利弊，臣这就照您的吩咐办。'},rabbit:{name:'栗栗',icon:'🐰',gift:'grass',line:'我想沿着小路种满花，这样就不会迷路啦！'}};
const jobs=[{title:'播下第一颗种子',desc:'建造一座猫草农场。',done:()=>Object.values(state.tiles).some(t=>t.type==='farm'),reward:{gold:20}},
 {title:'溪谷的第一篮收成',desc:'等待生产完成，或结束今天，然后收取猫草。',done:()=>state.total.harvest>=1,reward:{gold:25,wood:8}},
 {title:'给栗栗留一扇窗',desc:'建造蘑菇小屋，邀请栗栗入住。',done:()=>!!state.people.rabbit,reward:{gold:25}},
 {title:'把好心情分享出去',desc:'通过问候、送礼或经营取得 12 快乐值。',done:()=>state.stock.joy>=12||state.expanded,reward:{stars:1,gold:25}},
 {title:'越过溪谷的边界',desc:'攒满 60 金币、12 木材和 12 快乐值，开放东侧花坡。',done:()=>state.expanded,reward:{diamonds:1}}];
const mapWidth=8, mapHeight=9;
const originalTiles=48;
const eastExpansion={title:'东侧花坡',cost:{gold:60,wood:12},requirement:{joy:12},flag:'expanded'};
const southExpansion={title:'南岸新区',cost:{gold:85,wood:18,ore:4},requirement:{happiness:12},flag:'southExpanded'};

 wood:{price:14,amount:5},ore:{price:15,amount:3},
 grass:{price:10,amount:3},treat:{price:12,amount:1}
};
const counsel={
 supplies:{name:'整理国库',reward:{gold:18,wood:4},report:'臣已清点仓库，拨出一笔建造物资。'},

};
const workerBonus=id=>id==='advisor'?2:1;

state.castle??=newCastle();

};

};
const rivals={

};
let castleSlot=1, attackLane=2, target='moss', relocating=null;
const royalRelief={gold:30};
function recordReport(kind,report){
 state.reports??={};
 const entries=state.reports[kind]??=[];
 entries.unshift({day:state.day,report});
 if(entries.length>6)entries.pop();
}
function reportList(kind,title){
 const entries=state.reports?.[kind]??[];
 return '<section class="castle-card report-area"><h3>'+title+'</h3>'+
 (entries.length?'<ol class="report-list">'+entries.map(entry=>'<li><time>第 '+entry.day+' 天</time>'+entry.report+'</li>').join('')+'</ol>':'<p class="muted">暂无记录。</p>')+'</section>';
}
const castleCapacity=()=>4+2*state.castle.level;
const troopCount=()=>Object.values(state.castle.troops).reduce((sum,count)=>sum+count,0);
const slotPower=(building,slot)=>{
 const front=slot<3;
 const favored=(building.type==='wall'&&front)||(building.type==='tower'&&!front);
 return (defenses[building.type].power+Number(favored))*building.level;
};
const defensePower=lane=>[lane,lane+3].reduce((sum,slot)=>{
 const building=state.castle.defenses[slot];
 return sum+(building?slotPower(building,slot):0);
},0);

  const {lane,power}=c.threat, gap=power-garrisonPower(lane);
  return '他们会从'+lanes[lane]+'来。'+(gap>0?'还差 '+gap+' 点防御。先护住这一翼，再谈出征。':'这一路已经守得住。让居民安心休息吧。');
 }
 if(target==='mist'&&c.level<2)return '雾松堡地势险峻。等城堡升到二级，再带足补给去。';
 if(!troopCount())return '兵营还空着。先招募卫兵或斥候，我再替你比较路线。';
 const rival=rivals[target];
 const margins=rival.power.map((power,lane)=>attackPower(lane)-power);

 return '以现在的兵力，'+lanes[best]+'最合适。'+(margins[best]>=0?'从这里出征，预计可取胜。':'还差 '+(-margins[best])+' 点战力，先练兵或由我来鼓舞。');

function castleAction(a){
 const c=state.castle;
 const building=c.defenses[castleSlot];
 const parts=a.split('-');
 const id=parts.at(-1);
 if(a==='castle-move-cancel'){relocating=null;render();return}
 if(a.startsWith('castle-slot-')){
  const destination=Number(id);
  if(relocating!==null){
   if(c.defenses[destination]||!c.defenses[relocating])return;
   c.defenses[destination]=c.defenses[relocating];
   delete c.defenses[relocating];
   relocating=null;castleSlot=destination;
   c.report='防御设施已调往'+lanes[castleSlot%3]+(castleSlot<3?'前排。':'后排。');
   tell(c.report);return;
  }
  castleSlot=destination;render();return;
 }
 if(a.startsWith('castle-lane-')){attackLane=Number(id);render();return}
 if(a.startsWith('castle-target-')){target=id;render();return}
 let report;
 if(a==='castle-upgrade'&&c.level<3&&can(castleUpgradeCost())){
  add(castleUpgradeCost(),-1);c.level++;
  report='王家城堡升至 Lv.'+c.level+'，兵营容量增加。';
 }else if(a.startsWith('castle-build-')&&!building&&defenses[id]&&can(defenses[id].cost)){
  add(defenses[id].cost,-1);
  c.defenses[castleSlot]={type:id,level:1};
  report=lanes[castleSlot%3]+'的'+defenses[id].name+'已建成。';
 }else if(a==='castle-defense-upgrade'&&building&&building.level<c.level){
  const cost=scaledCost(defenses[building.type].cost,building.level+1);
  if(can(cost)){add(cost,-1);building.level++;report=defenses[building.type].name+'已升级。'}
 }else if(a==='castle-defense-move'&&building){
  relocating=castleSlot;render();return;
 }else if(a==='castle-defense-remove'&&building){
  add(defenses[building.type].cost);delete c.defenses[castleSlot];report='已拆除并退回基础造价。';
 }else if(a.startsWith('castle-train-')&&units[id]&&troopCount()<castleCapacity()&&can(units[id].cost)){
  add(units[id].cost,-1);c.troops[id]++;report=units[id].name+'加入了城堡驻军。';
 }else if(a==='castle-relief'&&state.reliefDay!==state.day&&state.labor.morale<100&&can(royalRelief)){
  add(royalRelief,-1);state.reliefDay=state.day;
  const before=state.labor.morale;
  adjustMorale(15);
  report='聂萌发放救济，劳动民心 +'+(state.labor.morale-before)+'。';
 }else if(a==='castle-treasury'){
  add({gold:100});report='聂萌从王室私库拨款，王国公库获得 100 金币。';
 }else if(a.startsWith('castle-magic-')&&!anySpellToday()){
  if(id==='bless'){
   state.royalSpell={day:state.day,id};
   Object.values(state.people).forEach(resident=>{resident.mood=Math.min(100,resident.mood+15)});
   add({joy:6});
   report='聂萌施展春晖赐福。全体居民心情 +15，王国快乐值 +6。';
  }
  if(id==='ward'){
   state.royalSpell={day:state.day,id};
   report='聂萌展开星辉结界，今晚遭遇反攻的一翼防御 +7。';
  }
 }else if(a.startsWith('castle-order-')&&c.order?.day!==state.day){
  if(id==='rally'&&c.raidDay!==state.day){c.order={id,day:state.day};report='聂萌登上城楼为部队鼓舞士气。今日出征战力 +4。'}
  if(id==='watch'){c.order={id,day:state.day};report='聂萌下令点亮城楼。今夜守城防御 +5。'}

  const rival=rivals[target], margin=attackPower()-rival.power[attackLane];

 }
 if(report){
  if(a==='castle-raid')recordReport('battle',report);
  const royal=a==='castle-treasury'||a==='castle-relief'||a.startsWith('castle-magic-')||a.startsWith('castle-order-');
  if(royal)recordReport('royal',report);
  else c.report=report;

function resolveCastleDefense(){

 const power=garrisonPower(threat.lane);
 if(power>=threat.power){
  add({gold:12,joy:2});c.report=lanes[threat.lane]+'守城成功（'+power+' / '+threat.power+'），获得 12 金币与 2 快乐值。';
 }else{
  const lost=Math.min(state.stock.gold,10);
  state.stock.gold-=lost;c.report=lanes[threat.lane]+'防守失利（'+power+' / '+threat.power+'），损失 '+lost+' 金币。';
 }
 c.threat=null;
 recordReport('battle',c.report);
 return c.report;
}

  if(def.yield)detail+=' 驻派奴仆 '+crew+'/'+maxCrew+' 人，每 '+crewSize+' 人使每批首项产物 +1。';
  const upgrade={gold:25*t.grade,ore:2*t.grade};
  $('inspect').innerHTML='<h3>'+def.icon+' '+def.name+'</h3><p class="muted">'+detail+'</p>'+(def.yield?workProgress(t):'')+'<div class="actions">'+(def.yield?(isReady(t)?button('收取产物','harvest',false,true):!planted(t)?button('开始制作','start',!can(def.input),true):'')+(work||person!=='hero'?button(work?'撤回 '+people[work[0]].name:'委派 '+people[person].name,'assign'):'')+button('派驻 '+crewSize+' 名奴仆','send-crew',idleRetinue()<crewSize||crew>=maxCrew)+(crew?button('召回 '+crewSize+' 名奴仆','recall-crew'):'')+button('升级 · '+format(upgrade),'upgrade',t.grade>=3||!can(upgrade))+(planted(t)&&!isReady(t)?button('加速 · 💎1','speed',!state.stock.diamonds):''):'')+(t.type==='cottage'&&!state.people.rabbit?button('邀请栗栗','invite',false,true):'')+((t.type==='road'||def.group==='装饰')?button('移除','remove'):'')+'</div>'+(def.yield?laborControls(selected):'')+(t.type==='shop'?'<div class="royal-judgment"><strong>商店货架</strong><div class="actions">'+Object.entries(shopGoods).map(([id,item])=>button('买 '+item.amount+names[id]+' · '+item.price+' 金币','shop-buy-'+id,state.stock.gold<item.price)).join('')+'</div></div>':'');
 }else{ $('inspect').innerHTML='<h3>'+(t?'🏰 王宫 · 粉色梦想豪宅':'🧭 地块详情')+'</h3><p class="muted">'+(t?'粉色露台和泳池环绕着聂萌的王座厅。<a href="#throne">前往王座厅与聂萌商议</a>。建造金币费用减免 20%（向上取整）。':selected!==null&&water(selected)?'溪水流过这里，选择草地建造。':'点击地图上的建筑查看产出，点击地图上的锁格查看拓地条件。')+'</p>'; }
 const p=state.people[person],who=people[person];
 $('residents').innerHTML='<h3>👑 王室与居民</h3><p class="muted">王室奴仆 '+royalRetinue+' 人 · '+idleRetinue()+' 人待命</p><p class="muted"><strong>劳动民心 '+state.labor.morale+'/100</strong> · 低于 '+lowMorale+' 时每批首项产物 −'+moralePenalty+'</p><div class="tabs">'+Object.keys(state.people).map(id=>button(people[id].name,'person-'+id,false,id===person)).join('')+'</div><div class="resident"><div class="portrait">'+who.icon+'</div><div><strong>'+who.name+'</strong>'+(person==='advisor'?'<p class="muted">忠诚 100% · 王国宰相</p>':'')+'<p class="muted">羁绊 Lv.'+(1+Math.floor(p.bond/4))+' · 心情 '+p.mood+(person==='hero'?' · 无限体力':' · 体力 '+(p.last===state.day?2:3)+'/3')+'</p></div></div>'+((p.bond>=4||person==='advisor'||person==='hero')?'<p class="muted">「'+who.line+'」</p>':'')+(person==='advisor'?'<p class="muted">'+(state.counselDay===state.day?'今日奏报已处理。':'每日可采纳一项奏报。')+'</p><div class="actions">'+Object.entries(counsel).map(([id,item])=>button(item.name+' · '+format(item.reward)+(id==='festival'?' · 民心 +'+relief:''),'counsel-'+id,state.counselDay===state.day,true)).join('')+'</div>':'')+'<div class="actions">'+button('打招呼','greet',p.last===state.day,true)+button('送礼 · '+icons[who.gift]+names[who.gift],'gift',!state.stock[who.gift]||p.giftDay===state.day)+'</div>';
 $('tabs').innerHTML=['生产','居住','商业','公共服务','特色建筑','装饰'].map(g=>button(g,'group-'+g,false,g===group)).join('')+(plan?button('取消建造','cancel'):'');
 $('build-controls').innerHTML=castlePicker('只看可建造','build-affordable',affordableOnly)+castlePicker('连续摆放','build-repeat',repeatBuild);
 $('build-plan').textContent=plan?'正在摆放 '+catalog[plan].name+'，点地图上的空地。':'选择建筑查看花费，再到地图上摆放。';
 const choices=Object.entries(catalog).filter(([,d])=>d.group===group&&(!affordableOnly||(level()>=d.level&&can(constructionCost(d)))));
 $('choices').innerHTML=choices.length?choices.map(([id,d])=>{
  const cost=constructionCost(d), unlocked=level()>=d.level;
  const status=!unlocked?'王国 Lv.'+d.level+' 解锁':!can(cost)?'材料不足':d.yield?'每批 '+format(d.yield):id==='cottage'?'提供住宅':'可摆放';
  return '<button class="choice" data-plan="'+id+'" aria-pressed="'+(id===plan)+'" '+(!unlocked?'disabled':'')+'>'+pixelSprite(id)+'<strong>'+d.name+'</strong><small>'+format(cost)+'</small><small>'+status+'</small></button>';
 }).join(''):'<p class="muted">此类别暂无可建造设施。</p>';
}
function tileClick(i){
 selected=i;
 if(!plan){message='查看右侧地块详情。';render();return}
 const d=catalog[plan];
 if(locked(i)||water(i)||state.tiles[i]){tell('这里无法建造，请选择一格空草地。');return}
 const cost=constructionCost(d);
 if(!can(cost)){tell('资源不足，无法建造。');return}
 add(cost,-1);state.total.built+=plan==='road'?0:1;if(plan!=='road')state.xp++;
 state.tiles[i]={type:plan,grade:1};
 if(d.yield&&!d.input)startBatch(state.tiles[i]);
 if(!repeatBuild||!can(cost))plan=null;
 tell(d.name+'建成了！');
}
function act(a){
 if(a==='build-affordable'){affordableOnly=!affordableOnly;render();return}
 if(a==='build-repeat'){repeatBuild=!repeatBuild;render();return}
 if(a.startsWith('castle-')){castleAction(a);return}
 const t=state.tiles[selected],d=t&&catalog[t.type],p=state.people[person],who=people[person],q=jobs[state.quest];
 if(a.startsWith('group-')){group=a.slice(6);plan=null;render();return}
 if(a.startsWith('person-')){person=a.slice(7);render();return}
 if(a.startsWith('counsel-')){
  const item=counsel[a.slice(8)];
  if(person==='advisor'&&item&&state.counselDay!==state.day){
   state.counselDay=state.day;add(item.reward);
   const before=state.labor.morale;
   if(a==='counsel-festival'){
    adjustMorale(relief);
    Object.values(state.people).forEach(resident=>{resident.mood=Math.min(100,resident.mood+10)});
   }
   const recovery=a==='counsel-festival'?' 劳动民心 +'+(state.labor.morale-before)+'，居民心情上升。':'';
   tell('刘博文奏报：'+item.report+' 获得 '+format(item.reward)+'。'+recovery);
  }
  return
 }
 if(a==='cancel'){plan=null;tell('建造已取消。');return}
 if(a==='quest'&&q?.done()){add(q.reward);state.quest++;state.xp++;tell('已领取手记奖励。');return}
 const week=Math.floor((state.day-1)/7)+1;
 if(a==='daily'&&state.daily!==state.day&&Object.values(state.people).some(r=>r.last===state.day)){state.daily=state.day;add({gold:12});state.xp++;tell('日常奖励到账：12 金币。');return}
 if(a==='weekly'&&state.week!==week&&(state.weekHarvest?.[week]??0)>=3){state.week=week;add({gold:35,diamonds:1});state.xp++;tell('每周奖励到账：35 金币、1 钻石。');return}
 if(a==='award'&&!state.award&&state.total.built>=5){state.award=true;add({diamonds:2});tell('达成建设成就，获得 2 钻石。');return}
 if(a==='expand'){
  const zone=expansionAt(selected);
  if(zone&&canExpand(zone)){
   add(zone.cost,-1);state[zone.flag]=true;state.xp++;tell(zone.title+'开放了！');
  }
  return
 }
 if(a.startsWith('shop-buy-')){
  const id=a.slice(9), item=shopGoods[id];
  if(t?.type==='shop'&&item&&state.stock.gold>=item.price){
   add({gold:-item.price,[id]:item.amount});
   tell('从溪谷商店购入 '+format({[id]:item.amount})+'。');
  }
  return
 }
 if(a==='invite'&&t?.type==='cottage'&&!state.people.rabbit){state.people.rabbit={bond:0,mood:75,last:0,job:null};person='rabbit';state.xp++;tell('栗栗搬进了蘑菇小屋。');return}
 if(a==='greet'&&p.last!==state.day){p.last=state.day;p.bond++;p.mood=Math.min(100,p.mood+5);add({joy:3});if(p.bond%4===0)add({stars:1});tell(who.name+'向你打招呼，快乐值 +3。');return}
 if(a==='gift'&&state.stock[who.gift]&&p.giftDay!==state.day){p.giftDay=state.day;state.stock[who.gift]--;const before=Math.floor(p.bond/4);p.bond+=3;p.mood=Math.min(100,p.mood+12);add({joy:4,stars:Math.floor(p.bond/4)-before});tell(who.name+'很喜欢这份礼物，快乐值 +4。');return}
 if(a==='remove'&&d?.group==='装饰'){delete state.tiles[selected];tell(d.name+'已移除。');return}
 if(!d?.yield)return;
 const crew=t.crew??0;
 if(a.startsWith('labor-')){
  if(a==='labor-end'&&state.labor.royalSite===selected){
   state.labor.royalSite=null;
   tell('聂萌结束了'+d.name+'的劳动指令。');
  }
  if(a==='labor-supervise'||a==='labor-pressure'){
   const mode=a.slice(6);
   Object.assign(state.labor,{royalSite:selected,mode});
   tell('聂萌来到'+d.name+'，'+(mode==='pressure'?'要求加紧生产。指令持续期间，每收取一批都会降低民心。':'开始亲自督工。'));
  }
  return
 }
 if(a==='send-crew'&&crew<maxCrew&&idleRetinue()>=crewSize){
  t.crew=crew+crewSize;
  tell(crewSize+' 名王室奴仆已派驻'+d.name+'。');return
 }
 if(a==='recall-crew'&&crew>=crewSize){
  t.crew=crew-crewSize;
  tell(crewSize+' 名王室奴仆已返回王宫。');return
 }
 if(a==='start'&&d.input&&!planted(t)&&can(d.input)){add(d.input,-1);startBatch(t);tell(d.name+'开始制作，劳动进度已开始。');return}
 if(a==='speed'&&planted(t)&&!isReady(t)&&state.stock.diamonds){state.stock.diamonds--;t.ready=state.day;tell('制作完成，可以收取了。');return}
 if(a==='assign'){
  const worker=Object.values(state.people).find(r=>r.job===selected);
  if(worker)worker.job=null;
  else if(person!=='hero')p.job=selected;
  else return;
  tell(worker?'居民已撤回。':who.name+'已开始工作，首项产物 +'+workerBonus(person)+'。');return
 }
 if(a==='upgrade'&&t.grade<3){const cost={gold:25*t.grade,ore:2*t.grade};if(can(cost)){add(cost,-1);t.grade++;tell(d.name+'升到了 '+t.grade+' 级。')}return}
 if(a==='harvest'&&isReady(t)){
  const adjacent=[selected-8,selected+8,...(selected%8?[selected-1]:[]),...(selected%8<7?[selected+1]:[])];
  const worker=Object.entries(state.people).find(([,resident])=>resident.job===selected);
  const bonus=Number(adjacent.some(i=>['flowers','fountain'].includes(state.tiles[i]?.type)))+(worker?workerBonus(worker[0]):0)+t.grade-1+crew/crewSize;
  const {royalSite,mode,morale}=state.labor;
  const royalBonus=royalSite===selected?royalYield[mode]:0;
  const pressed=royalSite===selected&&mode==='pressure';
  const penalty=morale<lowMorale?moralePenalty:0;
  const output={...d.yield},first=Object.keys(output)[0];
  output[first]=Math.max(1,output[first]+bonus+royalBonus-penalty);
  add(output);state.xp++;state.total.harvest++;
  if(d.mood)Object.values(state.people).forEach(resident=>{resident.mood=Math.min(100,resident.mood+d.mood)});
  if(d.morale)adjustMorale(d.morale);
  if(pressed)adjustMorale(-pressureCost);
  state.weekHarvest??={};state.weekHarvest[week]=(state.weekHarvest[week]??0)+1;
  if(d.input){delete t.ready;delete t.batchStart;}else startBatch(t);
  tell('收获 '+format(output)+'。'+((pressed||d.morale)?' 劳动民心 '+morale+' → '+state.labor.morale+'。':'')+(d.mood?' 全体居民心情已恢复。':''));
 }
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.id==='sleep'){
  const defenseReport=resolveCastleDefense();
  state.day++;
  adjustMorale(4);
  if(state.people.rabbit)state.people.rabbit.mood=Math.max(35,state.people.rabbit.mood-2);
  tell(defenseReport??'新的一天开始了，去看看有哪些产物可以收取。');return
 }
 if(b.dataset.tile!==undefined){tileClick(Number(b.dataset.tile));return}
 if(b.dataset.plan){plan=b.dataset.plan;selected=null;const d=catalog[plan];tell('准备建造'+d.name+'，请选择空地。');
  if(typeof window!=='undefined'&&window.matchMedia('(max-width: 760px)').matches)document.querySelector('.map-panel').scrollIntoView({block:'start'});
  return}
 if(b.dataset.action)act(b.dataset.action);
});
let batchesMigrated=false;
for(const t of Object.values(state.tiles)){
 if(planted(t)&&t.ready>state.day&&t.batchStart===undefined){
  t.batchStart=Date.now();batchesMigrated=true;
 }
}
if(batchesMigrated)save();
if(typeof location!=='undefined'){
 window.addEventListener('hashchange',()=>{
  syncWorkspace();
  window.scrollTo(0,0);
 });
 syncWorkspace();
}else render();
if(typeof setInterval==='function')setInterval(refreshWorkProgress,500);
</script></body></html>
