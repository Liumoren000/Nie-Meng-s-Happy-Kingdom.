main{max-width:1580px}.layout:not(.build-layout){display:block}.layout:not(.build-layout) .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));margin-top:14px}.build-layout{grid-template-columns:minmax(0,1fr) minmax(285px,320px)}
.island-view{width:100%;padding:0;border:0;overflow:visible;background:#477b8e}.map#land-grid{width:100%;height:auto;aspect-ratio:1;overflow:visible}
.map#land-grid .island-tile{left:calc(var(--x) * 100% / 39);top:calc(var(--y) * 100% / 39);width:calc(100% / 39);height:calc(100% / 39);scroll-margin-top:58px}.map#land-grid .island-actor{left:calc((var(--x) + .19) * 100% / 39);top:calc((var(--y) + .16) * 100% / 39);width:calc(62% / 39);height:calc(62% / 39)}
.map-detail-drawer{position:fixed;z-index:8;right:16px;bottom:14px;width:min(370px,calc(100% - 32px));max-height:45dvh;overflow:auto;box-shadow:0 4px 20px #26372e44}.map-panel:fullscreen,.map-panel.map-overlay{display:flex;flex-direction:column;width:100%;height:100%;max-width:none;overflow:hidden;border:0;border-radius:0;background:#f6f0df}.map-panel.map-overlay{position:fixed;inset:0;z-index:100;height:100dvh}.map-panel:fullscreen .island-view,.map-panel.map-overlay .island-view{flex:1;min-height:0;display:grid;place-items:center;container-type:size}.map-panel:fullscreen .map#land-grid,.map-panel.map-overlay .map#land-grid{width:min(100cqw,100cqh);height:auto}.map-panel:fullscreen .map-supplies,.map-panel.map-overlay .map-supplies{display:none}
@media(max-width:760px){.build-layout{grid-template-columns:1fr}.map-detail-drawer{right:8px;bottom:8px;width:calc(100% - 16px)}}

.map#land-grid .island-tile,.map#land-grid .island-tile.water{background:transparent;box-shadow:none}
.map#land-grid .island-tile.locked{background:#273d2d2c}
.map#land-grid .island-tile.build-available{box-shadow:inset 0 0 0 1px #f8e6aaad}
.map#land-grid .island-tile:hover,.map#land-grid .island-tile.selected,.map#land-grid .island-tile:focus-visible{background:#faeec72e;box-shadow:inset 0 0 0 2px #fff0a9;z-index:3}
.map#land-grid .island-tile.weather-rain:after,.map#land-grid .island-tile.weather-snow:after{opacity:.56}

.walking-map .island-view{height:clamp(330px,62vh,680px);position:relative;overflow:hidden;background:#2c657d;display:block;container-type:normal}
.walking-map .map#land-grid{width:calc(max(100%,3280px)*var(--camera-zoom,1));height:auto;transform-origin:0 0;transition:transform .16s linear}
.walking-map .map#land-grid .island-actor{transition:left .14s linear,top .14s linear}
.walking-map .map#land-grid .facing-tile{box-shadow:inset 0 0 0 2px #f8e5a9ad;z-index:2}
.walking-map .map#land-grid .placement-preview{background:#f8ecae45;box-shadow:inset 0 0 0 3px #fff2aa}
.build-layout .walking-map .actor-toolbar{display:block}.walk-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.walk-controls .actions{margin-top:4px}.walk-controls .button{min-width:35px}.walk-controls p{margin:0}
.map-panel.walking-map:fullscreen .island-view,.map-panel.walking-map.map-overlay .island-view{display:block}
.map-panel.walking-map:fullscreen .map#land-grid,.map-panel.walking-map.map-overlay .map#land-grid{width:calc(max(100%,3280px)*var(--camera-zoom,1))}
@media(prefers-reduced-motion:reduce){.walking-map .map#land-grid{transition:none}}

.stage-hud{display:none}.button kbd{padding:1px 4px;background:#183832;border-radius:2px;color:#fff4cc}.map#land-grid .citadel-tile{z-index:3}.map#land-grid .citadel-tile .citadel-size{position:absolute;inset:-100%;z-index:1;pointer-events:none}.map#land-grid .citadel-tile .citadel-size .pixel-sprite{inset:0}.map#land-grid .citadel-tile:after{z-index:2}.map#land-grid .citadel-tile:hover{filter:brightness(1.06)}
body.game-stage{overflow:hidden;background:#2b483d}.game-stage>header,.game-stage main>.heading,.game-stage .realm-nav,.game-stage .footer,.game-stage .map-top,.game-stage #land-workspace>.side:not(:has(.map-detail-drawer)){display:none}.game-stage main{padding:0;max-width:none}.game-stage #land-workspace{display:block}.game-stage .map-panel{border:0;border-radius:0;box-shadow:none;height:100dvh;background:#2c657d;position:relative;overflow:hidden}.game-stage .map-panel .island-view{height:100%;max-height:none}.game-stage #land-workspace>.side{margin:0}.game-stage .side>*:not(.map-detail-drawer){display:none}.game-stage .map-panel .hint{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);min-height:0;width:max-content;max-width:84%;padding:5px 10px;border-radius:4px;background:#213830c9;color:#fff2c7;pointer-events:none;font-size:12px}.game-stage .map-panel>.map-supplies,.game-stage .map-panel>.climate-panel,.game-stage .map-panel>.actor-toolbar,.game-stage .map-panel:not(.stage-toast) .hint{display:none}
.game-stage .stage-hud{display:block;position:absolute;inset:0;pointer-events:none;z-index:6}.stage-top,.stage-hotbar,.stage-menu,.stage-dpad{pointer-events:auto;color:#fff5d2}.stage-top{display:flex;justify-content:space-between;align-items:start;padding:12px}.stage-date,.stage-hotbar,.stage-menu,.stage-dpad{background:#263b30ee;border:2px solid #b49358;box-shadow:0 3px #203429}.stage-date{padding:6px 11px;border-radius:3px}.stage-date small{display:block;color:#eddea6}.stage-hotbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:5px;white-space:nowrap}.stage-hotbar .button,.stage-dpad .button,.stage-menu .button{color:#263b2a}.stage-hotbar a,.stage-menu a{text-decoration:none}.stage-menu{position:absolute;right:12px;top:60px;width:min(380px,calc(100vw - 24px));padding:14px;border-radius:5px}.stage-menu h3{margin-bottom:8px}.stage-wallet{display:flex;gap:6px;flex-wrap:wrap}.stage-wallet span{padding:3px 5px;background:#ffffff12;border-radius:3px}.stage-dpad{display:none}@media(pointer:coarse){.stage-dpad{display:grid;position:absolute;bottom:66px;left:10px;grid-template-columns:repeat(2,38px);gap:2px;padding:4px}.stage-dpad .button{padding:3px}.game-stage .map-panel .hint{bottom:119px}}

.map#land-grid .parcel-path{position:absolute;inset:0;pointer-events:none;z-index:0}.path-arm{position:absolute;background:#d8b379;box-shadow:inset 0 0 0 1px #99744a70}.path-east,.path-west{height:18%;top:41%;width:59%}.path-east{right:0}.path-west{left:0}.path-north,.path-south{width:18%;left:41%;height:59%}.path-north{top:0}.path-south{bottom:0}.path-arm:after{content:'';position:absolute;inset:2px;background:repeating-linear-gradient(90deg,#f0ce9033 0 3px,transparent 3px 10px);pointer-events:none}.path-north:after,.path-south:after{background:repeating-linear-gradient(#f0ce9033 0 3px,transparent 3px 10px)}
.lane-lamp{position:absolute;width:4%;height:19%;right:24%;top:27%;background:#503c38;z-index:2}.lane-lamp:before{content:'';position:absolute;width:270%;height:44%;left:-85%;top:0;background:#b19063;border:1px solid #513f39;box-sizing:border-box}.lane-lamp:after{content:'';position:absolute;inset:-11px -14px;opacity:0;background:radial-gradient(ellipse at 50% 28%,#ffe594b3,#f5c45a44 37%,transparent 69%);transition:opacity 1.4s;pointer-events:none}.map-panel[data-light="3"] .lane-lamp:after,.map-panel[data-light="2"] .lane-lamp:after{opacity:1}.map-panel[data-light="3"] .lane-lamp:before,.map-panel[data-light="2"] .lane-lamp:before{background:#ffeaa8;box-shadow:0 0 6px 2px #ffd868}
.stage-top-right{display:flex;gap:6px;align-items:start}.stage-location{text-align:right}.stage-location strong{white-space:nowrap}.stage-location small{white-space:nowrap}@media(max-width:480px){.stage-top-right{gap:3px}.stage-location{font-size:12px;padding:5px 7px}.stage-top .stage-close{max-width:89px;white-space:normal}}
.walking-map .island-view.map-zooming #land-grid{transition:none}

.map#land-grid .island-actor,.walking-map .map#land-grid .island-actor{transition:left var(--stride,180ms) linear,top var(--stride,180ms) linear}
.map#land-grid .island-actor .pixel-sprite{animation:none;transform:scaleX(var(--face,1))}.island-actor[data-face=west]{--face:-1}
.map#land-grid .island-actor.actor-walking .pixel-sprite{animation:pixelStride var(--stride,180ms) steps(1,end) infinite}
@keyframes pixelStride{0%,100%{transform:translateY(0) scaleX(var(--face,1))}50%{background-image:var(--step-frame);transform:translateY(-2px) scaleX(var(--face,1))}}
@media(prefers-reduced-motion:reduce){.map#land-grid .island-actor,.map#land-grid .island-actor .pixel-sprite{transition:none!important;animation:none!important}}

function cropReady(crop,now=Date.now()){return Boolean(crop&&crop.wateredAt!=null&&now-crop.wateredAt>=cropDelay)}

}
function tideIsLow(now=Date.now()){return (state.day+climatePhase(now))%3===1}

 if(!Number.isInteger(id)||!walkable(id)||state.tiles[id]||state.crops[id]||state.events.foraged[id]===state.day)return null;
 const {biome}=island[id];
 if(biome==='coast'&&tideIsLow(now)&&id%5===0)return 'shell';
 if((biome==='rainforest'||biome==='wetland')&&id%4===0&&climatePhase(now)>0&&
    wetWeather(weatherFor(biome,now-climatePeriod))&&!wetWeather(weatherFor(biome,now)))return 'mushroom';
 return null;
}

 const elapsed=Math.max(0,now-state.dayClock);

 const phase=hour>=5&&hour<9?0:hour>=9&&hour<17?1:hour>=17&&hour<21?2:3;
 return {phase,label:String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0'),days:Math.floor(elapsed/gameDayLength)};
}
function refreshDayClock(now=Date.now()){
 const time=localGameTime(now);

  state.dayClock+=time.days*gameDayLength;
  advanceDay(time.days);

  $('map-panel').dataset.light=String(time.phase);
  lastDayPhase=time.phase;
 }
 return false;
}

function biomeAt(q,r,distance,legacy,edge){
 if(legacy)return 'meadow';
 if(distance===edge&&(q-r+27)%4===0)return 'ocean';
 if(distance===edge&&r>-edge+2)return 'coast';
 const x=q+r/2;
 if(r<=-6)return x<0?'alpine':'tundra';
 if(x>=5)return r<2?'desert':'steppe';
 if(r>=5)return x<0?'rainforest':'wetland';
 if(x<=-5)return r<-1?'alpine':r>1?'rainforest':'volcanic';
 if(r<=-3)return 'steppe';
 if(r>=3)return 'wetland';
 return 'meadow';
}

   if(distance>edge||(edge===radius&&distance<=originalRadius))continue;
   if(edge===radius&&distance===radius&&rim++%2)continue;
   const key=hexKey(q,r);
   const legacy=oldCoordinates.get(key);
   const tile={id:legacy??nextTile++,q,r,biome:biomeAt(q,r,distance,legacy!==undefined,edge)};
   island[tile.id]=tile;
   hexes.set(key,tile.id);
  }
 }
}

function installCitadel(){

  const building=state.tiles[id];

  const distance=hex=>Math.abs(hex.q+Math.floor(hex.r/2)-origin.q-Math.floor(origin.r/2))+Math.abs(hex.r-origin.r);
  const vacancy=island.filter(({id:other})=>!citadelGround.has(other)&&!occupied.has(other)&&!water(other)&&!locked(other))
   .sort((a,b)=>distance(a)-distance(b)||a.id-b.id)[0];
  if(!vacancy)continue;
  state.tiles[vacancy.id]=building;
  delete state.tiles[id];
  occupied.add(vacancy.id);
  for(const resident of Object.values(state.people))if(resident.job===id)resident.job=vacancy.id;
  if(state.labor.royalSite===id)state.labor.royalSite=vacancy.id;

const roadDirections=['east','south','west','north'];
const roadEntrance=34;
function roadNetwork(){
 const spans=new Map();
 const buildings=new Set(Object.keys(state.tiles).map(Number));
 buildings.delete(roadEntrance);
 const previous=new Map([[roadEntrance,null]]);
 const frontier=[roadEntrance];
 for(let i=0;i<frontier.length;i++){
  const current=frontier[i];
  for(const next of adjacentTiles(current)){
   if(next===undefined||previous.has(next)||!walkable(next))continue;
   previous.set(next,current);
   if(!buildings.has(next)||state.tiles[next].type==='road')frontier.push(next);
  }
 }
 // Use lanes through a dense block only when an open-space route is unavailable.
 if([...buildings].some(id=>!previous.has(id))){
  const fallback=[...previous.keys()];
  for(let i=0;i<fallback.length;i++){
   for(const next of adjacentTiles(fallback[i])){
    if(next===undefined||previous.has(next)||!walkable(next))continue;
    previous.set(next,fallback[i]);fallback.push(next);
   }
  }
 }
 function link(from,to){
  const direction=adjacentTiles(from).indexOf(to);
  if(direction<0)return;
  if(!spans.has(from))spans.set(from,new Set());
  if(!spans.has(to))spans.set(to,new Set());
  spans.get(from).add(roadDirections[direction]);
  spans.get(to).add(roadDirections[(direction+2)%4]);
 }
 link(roadEntrance,35);
 for(const id of buildings){
  for(let here=id;previous.get(here)!=null;here=previous.get(here))link(here,previous.get(here));
 }
 return spans;
}

function nextCameraZoom(scale,delta){
 return Math.min(2.25,Math.max(.22,scale*Math.exp(-delta*.0019)));
}
function boundedCameraOffset(world,viewport,offset){
 return world<viewport?(world-viewport)/2:Math.max(0,Math.min(world-viewport,offset));
}
function cameraCenter(grid){
 const {q,r}=island[actorPosition(walkingActor())];
 const size=radius*2+1;
 const x=q+Math.floor(r/2)+radius+.5,y=r+radius+.47;
 const frameCastle=stageOpeningView&&Math.hypot(x-(radius+.5),y-(radius+.5))<5;
 return {
  x:(frameCastle?x*.35+(radius+.5)*.65:x)*grid.clientWidth/size,
  y:(frameCastle?y*.35+(radius+.5)*.65:y)*grid.clientHeight/size
 };
}
function zoomMapAtPointer(event,view){
 if(!exploreMode||!event.deltaY||mapDrag?.moved)return;
 event.preventDefault();
 const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?view.clientHeight:1);
 const scale=nextCameraZoom(cameraZoom,delta);
 if(scale===cameraZoom)return;
 const grid=$('land-grid'), bounds=grid.getBoundingClientRect(), frame=view.getBoundingClientRect();
 if(!bounds.width||!bounds.height)return;
 const anchorX=(event.clientX-bounds.left)/bounds.width;
 const anchorY=(event.clientY-bounds.top)/bounds.height;
 view.classList.add('map-zooming');
 cameraZoom=scale;
 grid.style.setProperty('--camera-zoom',cameraZoom);
 const center=cameraCenter(grid);
 cameraPan={
  x:anchorX*grid.clientWidth-(event.clientX-frame.left)+view.clientWidth/2-center.x,
  y:anchorY*grid.clientHeight-(event.clientY-frame.top)+view.clientHeight/2-center.y
 };
 focusCamera();
 clearTimeout(zoomSettler);
 zoomSettler=setTimeout(()=>view.classList.remove('map-zooming'),140);
}
function setupMapDrag(){
 const view=$('island-view');
 view.addEventListener('wheel',event=>zoomMapAtPointer(event,view),{passive:false});
 view.addEventListener('pointerdown',event=>{
  if(!exploreMode||event.button!==0||event.pointerType!=='mouse')return;
  mapDrag={id:event.pointerId,x:event.clientX,y:event.clientY,panX:cameraPan.x,panY:cameraPan.y,moved:false};
 });
 view.addEventListener('pointermove',event=>{
  if(!mapDrag||event.pointerId!==mapDrag.id)return;
  const dx=event.clientX-mapDrag.x,dy=event.clientY-mapDrag.y;
  if(!mapDrag.moved&&Math.hypot(dx,dy)<5)return;
  if(!mapDrag.moved){mapDrag.moved=true;view.setPointerCapture(event.pointerId);view.classList.add('map-dragging');}
  cameraPan={x:mapDrag.panX-dx,y:mapDrag.panY-dy};
  focusCamera();
 });
 const finish=event=>{
  if(!mapDrag||event.pointerId!==mapDrag.id)return;
  if(mapDrag.moved)suppressMapClickUntil=Date.now()+260;
  mapDrag=null;view.classList.remove('map-dragging');
 };
 window.addEventListener('pointerup',finish);
 window.addEventListener('pointercancel',finish);
 view.addEventListener('click',event=>{
  if(Date.now()<suppressMapClickUntil){event.preventDefault();event.stopImmediatePropagation();}
 },true);
}

function stepActors(now){
 state.actorPositions??={};
 const occupied=new Set(['hero','advisor',...Object.keys(animals)].map(actorPosition));
 for(const [index,[id,animal]] of Object.entries(animals).entries()){
  const pace=animalPace[id];
  const step=animalSteps.get(id)??{next:0,left:pace.burst,direction:null,previous:null};
  if(now<step.next)continue;
  animalSteps.set(id,step);
  const origin=island[animal.home], current=actorPosition(id);
  const options=adjacentTiles(current).map((tile,direction)=>({tile,direction})).filter(({tile})=>{
   if(!walkable(tile)||state.tiles[tile]||occupied.has(tile))return false;
   const {q,r}=island[tile];
   return Math.max(Math.abs(q-origin.q),Math.abs(r-origin.r),Math.abs(q-origin.q+r-origin.r))<=3;
  });
  if(!options.length){step.next=now+pace.pause;continue}
  const forward=options.find(option=>option.direction===step.direction);
  const onward=options.filter(option=>option.tile!==step.previous);
  const choices=onward.length?onward:options;
  const chosen=forward??choices[(Math.floor(now/190)+index)%choices.length];
  step.previous=current;step.direction=chosen.direction;step.left--;
  step.next=now+(step.left?pace.stride:pace.pause+index*170);
  if(!step.left){step.left=pace.burst;step.direction=null;}
  occupied.delete(current);occupied.add(chosen.tile);
  state.actorPositions[id]=chosen.tile;
  setActorMotion(id,chosen.direction,pace.stride,now);
  updateActorPosition(id);
 }
}

  const todo=[frontier[0]];

  for(let i=0;i<todo.length&&targets.size;i++){
   for(const n of edges.get(todo[i])){
    if(!open.has(n)||reachable.has(n))continue;
    reachable.add(n);targets.delete(n);todo.push(n);
   }
  }

 }

   if(['alpine','tundra','volcanic'].includes(biome)&&rarity%11<3)type='ridge';

  $('inspect').innerHTML='<h3>'+def.icon+' '+def.name+' · Lv.'+t.grade+'</h3>'+gradePreview(t.type,t.grade)+'<p class="muted">'+detail+'</p>'+(def.yield?workProgress(t):'')+'<div class="actions">'+(def.yield?(isReady(t)?button('收取产物','harvest',false,true):!planted(t)?button('开始制作','start',!can(def.input),true):'')+(work||person!=='hero'?button(work?'撤回 '+people[work[0]].name:'委派 '+people[person].name,'assign'):'')+button('派驻 '+crewSize+' 名奴仆','send-crew',idleRetinue()<crewSize||crew>=maxCrew)+(crew?button('召回 '+crewSize+' 名奴仆','recall-crew'):'')+(planted(t)&&!isReady(t)?button('加速 · 💎1','speed',!can({diamonds:1})):''):'')+(t.type==='cottage'&&!state.people.rabbit?button('邀请栗栗','invite',false,true):'')+(t.grade<3?button('升级 · '+format(upgrade),'upgrade',!can(upgrade),true):'')+(movingBuilding===selected?button('取消移动','building-cancel'):(demolishingBuilding===selected?button('确认拆除','building-confirm-remove',false,true)+button('取消','building-cancel'):button('移动建筑','building-move')+button('拆除建筑','building-remove')))+'</div>'+(def.yield?laborControls(selected):'')+(t.type==='shop'?'<div class="royal-judgment"><strong>商店货架</strong><div class="actions">'+Object.entries(shopGoods).map(([id,item])=>button('买 '+item.amount+names[id]+' · '+item.price+' 金币','shop-buy-'+id,!can({gold:item.price}))).join('')+'</div></div>':'');
 }else if(terrainObstacle(selected)==='tree'){
  $('inspect').innerHTML='<h3>🌳 树木</h3><p class="muted">砍伐后可建造、种植，也可供小路通过。</p><div class="actions">'+button('砍树 · 获得 8 木材','terrain-chop',false,true)+'</div>';
 }else if(terrainObstacle(selected)==='ridge'){
  $('inspect').innerHTML='<h3>⛰️ 山岩</h3><p class="muted">小路和建筑会绕开这片山岩。</p>';
 }else if(districtMarkers.has(selected)&&!state.crops[selected]&&!forageAt(selected)){
  const district=districts[districtMarkers.get(selected)];
  $('inspect').innerHTML='<h3>📍 '+district.name+'</h3><p class="muted">'+district.description+'</p>'+renderFieldDetails(selected);
 }else if(selected!==null&&(canPlant(selected)||state.crops[selected]||forageAt(selected))){
  $('inspect').innerHTML=renderFieldDetails(selected);
 }else if(citadelGround.has(selected)){
  $('inspect').innerHTML='<h3>'+mansionName+'</h3><p class="muted"><a href="#throne">进入王座厅</a></p>';
 }else{
  $('inspect').innerHTML='<h3>🧭 地块详情</h3><p class="muted">'+(selected!==null&&water(selected)?'溪水流过这里，选择草地建造。':'点击地图上的建筑查看产出，点击地图上的锁格查看拓地条件。')+'</p>';
 }
 const inspect=$('inspect');
 if(def)inspect.innerHTML+=renderNightMarket(t.type);
 const openDetails=(workspace==='map'||workspace==='build')&&selected!==null;
 inspect.className='panel card'+(openDetails?' map-detail-drawer':'');
 if(openDetails&&movingBuilding===null)inspect.innerHTML+='<div class="actions">'+button('关闭地块详情','close-map-details')+'</div>';
 const p=state.people[person],who=people[person];
 $('residents').innerHTML='<h3>👑 王室与居民</h3><p class="muted">王室奴仆 '+royalRetinue+' 人 · '+idleRetinue()+' 人待命</p><p class="muted"><strong>劳动民心 '+state.labor.morale+'/100</strong> · 低于 '+lowMorale+' 时每批首项产物 −'+moralePenalty+'</p><div class="tabs">'+Object.keys(state.people).map(id=>button(people[id].name,'person-'+id,false,id===person)).join('')+'</div><div class="resident"><div class="portrait">'+who.icon+'</div><div><strong>'+who.name+'</strong>'+(person==='advisor'?'<p class="muted">忠诚 100% · 王国宰相</p>':'')+'<p class="muted">羁绊 Lv.'+(1+Math.floor(p.bond/4))+' · 心情 '+p.mood+(person==='hero'?' · 无限体力':' · 体力 '+(p.last===state.day?2:3)+'/3')+'</p></div></div>'+((p.bond>=4||person==='advisor'||person==='hero')?'<p class="muted">「'+who.line+'」</p>':'')+(person==='advisor'?'<p class="muted">'+(state.counselDay===state.day?'今日奏报已处理。':'每日可采纳一项奏报。')+'</p><div class="actions">'+Object.entries(counsel).map(([id,item])=>button(item.name+' · '+format(item.reward)+(id==='festival'?' · 民心 +'+relief:''),'counsel-'+id,state.counselDay===state.day,true)).join('')+'</div>':'')+'<div class="actions">'+button('打招呼','greet',p.last===state.day,true)+button('送礼 · '+icons[who.gift]+names[who.gift],'gift',!can({[who.gift]:1})||p.giftDay===state.day)+(person==='hero'?'':button('送贝壳','life-gift',!can({shell:1})||state.events.giftDay===state.day))+'</div>';
 $('tabs').innerHTML=['生产','居住','商业','公共服务','特色建筑','装饰'].map(g=>button(g,'group-'+g,false,g===group)).join('')+(plan?button('取消建造','cancel'):'');
 $('build-controls').innerHTML=choiceToggle('只看可建造','build-affordable',affordableOnly)+choiceToggle('连续摆放','build-repeat',repeatBuild);
 $('build-plan').textContent=plan?'正在摆放 '+catalog[plan].name+'，点地图上的空地。':'选择建筑查看花费，再到地图上摆放。';
 const choices=Object.entries(catalog).filter(([,d])=>d.group===group&&(!affordableOnly||(level()>=d.level&&can(constructionCost(d)))));
 $('choices').innerHTML=choices.length?choices.map(([id,d])=>{
  const cost=constructionCost(d), unlocked=level()>=d.level;
  const status=!unlocked?'王国 Lv.'+d.level+' 解锁':!can(cost)?'材料不足':d.yield?'每批 '+format(d.yield):id==='cottage'?'提供住宅':'可摆放';
  return '<button class="choice" data-plan="'+id+'" aria-pressed="'+(id===plan)+'" '+(!unlocked?'disabled':'')+'>'+pixelSprite(id)+'<strong>'+d.name+'</strong><small>'+format(cost)+'</small><small>'+status+'</small></button>';
 }).join(''):'<p class="muted">此类别暂无可建造设施。</p>';
}
function tileClick(i){
 if(movingBuilding!==null){
  const source=movingBuilding;
  if(i===source||!walkable(i)||state.tiles[i]||state.crops[i]){tell('请选择一块开放的空地。');return}
  const building=state.tiles[source];
  if(!building){movingBuilding=null;render();return}
  state.tiles[i]=building;delete state.tiles[source];
  for(const resident of Object.values(state.people))if(resident.job===source)resident.job=i;
  if(state.labor.royalSite===source)state.labor.royalSite=i;
  movingBuilding=null;selected=i;
  tell(catalog[building.type].name+'已搬到新地块。');return;
 }
 if(demolishingBuilding!==null&&i!==demolishingBuilding)demolishingBuilding=null;
 if(state.crops[i]&&(plan||movingBuilding!==null)){tell('先采收这块地的作物，再摆放建筑。');return}
 if(citadelGround.has(i)&&!plan){
  if(typeof location!=='undefined')location.hash='throne';
  else setWorkspace('throne');
  return;
 }
 selected=i;
 if(!plan){message='查看右侧地块详情。';render();return}
 const d=catalog[plan];
 if(!walkable(i)||state.tiles[i]||state.crops[i]){tell('这里无法建造，请选择一格空草地。');return}
 const cost=constructionCost(d);
 if(!can(cost)){tell('资源不足，无法建造。');return}
 add(cost,-1);state.total.built+=plan==='road'?0:1;if(plan!=='road')state.xp++;
 state.tiles[i]={type:plan,grade:1};
 if(d.yield&&!d.input)startBatch(state.tiles[i]);
 if(!repeatBuild||!can(cost))plan=null;
 tell(d.name+'建成了！');
}
function act(a){
 if(a==='terrain-chop'){
  if(terrainObstacle(selected)==='tree'&&!locked(selected)){
   state.clearedTerrain[selected]=true;add({wood:8});
   tell('取到了 8 木材，这一格已腾成空地。');
  }
  return;
 }
 if(a.startsWith('district-')){locateDistrict(a.slice(9));return}
 if(a.startsWith('life-')){lifeAction(a);return}
 if(a==='building-cancel'){movingBuilding=null;demolishingBuilding=null;render();return}
 if(a==='building-move'&&catalog[state.tiles[selected]?.type]){
  movingBuilding=selected;demolishingBuilding=null;plan=null;
  tell('选择空地，或走到空地旁按 E 移动建筑。');return;
 }
 if(a==='building-remove'&&catalog[state.tiles[selected]?.type]){
  demolishingBuilding=selected;movingBuilding=null;render();return;
 }
 if(a==='building-confirm-remove'&&selected!==null&&demolishingBuilding===selected){
  const building=state.tiles[selected], def=catalog[building?.type];
  if(!def)return;
  const refund=Object.fromEntries(Object.entries(constructionCost(def)).map(([id,amount])=>[id,Math.floor(amount*.3)]).filter(([,amount])=>amount>0));
  add(refund);delete state.tiles[selected];
  for(const resident of Object.values(state.people))if(resident.job===selected)resident.job=null;
  if(state.labor.royalSite===selected)state.labor.royalSite=null;
  demolishingBuilding=null;
  tell(def.name+'已拆除。'+(Object.keys(refund).length?' 回收 '+format(refund)+'。':''));return;
 }
 if(a==='stage-menu'){stageMenu=!stageMenu;render();return}
 if(a==='stage-switch'){act('actor-command-'+(walkingActor()==='hero'?'advisor':'hero'));return}
 if(a==='stage-overview'){
  stageMenu=false;exploreMode=!exploreMode;
  if(exploreMode)mapActor??='hero';
  render();return;
 }
 if(a==='toggle-explore'){
  exploreMode=!exploreMode;
  if(exploreMode)mapActor??='hero';
  else if(typeof location!=='undefined'&&location.hash==='#explore')location.hash='map';
  render();
  return;
 }
 if(a==='walk-interact'){interactFacing();return}
 if(a.startsWith('walk-')){moveWalker(Number(a.slice(5)));return}
 if(a.startsWith('actor-command-')||a.startsWith('actor-pick-')){
  const id=a.split('-').at(-1), animal=animals[id];
  if(animal){
   state.pettedDay??={};
   const first=state.pettedDay[id]!==state.day;
   if(first){state.pettedDay[id]=state.day;add({joy:1})}
   tell(animal.sound+(first?' 快乐值 +1。':''));
  }else if((workspace==='map'||isExploring())&&(id==='hero'||id==='advisor')){
   mapActor=id;stageOpeningView=false;cameraPan={x:0,y:0};if(workspace!=='build')plan=null;render();focusHex(actorPosition(id));
  }
  return
 }
 if(a==='actor-clear'){mapActor=null;render();return}
 if(a==='actor-supervise'&&mapActor==='hero'){
  selected=actorPosition('hero');
  act('labor-supervise');return;
 }
 if(a==='actor-comfort'&&mapActor==='advisor'){
  person='advisor';act('counsel-festival');return;
 }
 if(a==='map-center'){
  selected=null;stageOpeningView=false;
  if(exploreMode){
   const target=island[citadelTile],from=island[actorPosition(walkingActor())],grid=$('land-grid');
   const size=radius*2+1;
   const dx=target.q+Math.floor(target.r/2)-from.q-Math.floor(from.r/2);
   cameraPan={x:dx*grid.clientWidth/size,y:(target.r-from.r)*grid.clientHeight/size};
  }else cameraPan={x:0,y:0};
  if(workspace==='climate'&&typeof location!=='undefined')location.hash='map';
  render();return;
 }
 if(a==='map-fullscreen'){
  const panel=$('map-panel');
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  else if(panel.requestFullscreen)panel.requestFullscreen().catch(()=>showFullMapOverlay());
  else showFullMapOverlay();
  return;
 }
 if(a==='close-map-overlay'){
  $('map-panel').classList.remove('map-overlay');
  renderClimate();return;
 }
 if(a==='close-map-details'){selected=null;demolishingBuilding=null;render();return}
 if(a.startsWith('climate-focus-')){
  const biome=a.slice(14);
  const tile=island.find(hex=>hex.biome===biome&&hex.id>=mapWidth*mapHeight);
  if(tile){exploreMode=false;mapActor=null;selected=tile.id;if(typeof location!=='undefined')location.hash='map';else setWorkspace('map');render();focusHex(tile.id)}
  return;
 }
 if(a==='toggle-unlimited'){
  state.unlimitedResources=!state.unlimitedResources;
  tell(state.unlimitedResources?'无限资源已开启。':'无限资源已关闭，原有余额已恢复。');
  return;
 }
 if(a.startsWith('field-')){
  const id=a.slice(6), activity=fieldActivities[id];
  state.fieldActivityDay??={};
  if(activity&&state.fieldActivityDay[id]!==state.day){
   state.fieldActivityDay[id]=state.day;
   add(activity.reward);
   tell(activity.label+'完成，获得 '+format(activity.reward)+'。');
  }
  return
 }
 if(a==='build-affordable'){affordableOnly=!affordableOnly;render();return}
 if(a==='build-repeat'){repeatBuild=!repeatBuild;render();return}
 if(a.startsWith('royal-')){royalAction(a);return}
 const t=state.tiles[selected],d=t&&catalog[t.type],p=state.people[person],who=people[person],q=jobs[state.quest];
 if(a.startsWith('group-')){group=a.slice(6);plan=null;render();return}
 if(a.startsWith('person-')){person=a.slice(7);render();return}
 if(a.startsWith('counsel-')){
  const item=counsel[a.slice(8)];
  if(person==='advisor'&&item&&state.counselDay!==state.day){
   state.counselDay=state.day;add(item.reward);
   const before=state.labor.morale;
   if(a==='counsel-festival'){
    adjustMorale(relief);
    Object.values(state.people).forEach(resident=>{resident.mood=Math.min(100,resident.mood+10)});
   }
   const recovery=a==='counsel-festival'?' 劳动民心 +'+(state.labor.morale-before)+'，居民心情上升。':'';
   tell('刘博文奏报：'+item.report+' 获得 '+format(item.reward)+'。'+recovery);
  }
  return
 }
 if(a==='cancel'){plan=null;tell('建造已取消。');return}
 if(a==='quest'&&q?.done()){add(q.reward);state.quest++;state.xp++;tell('已领取手记奖励。');return}
 const week=Math.floor((state.day-1)/7)+1;
 if(a==='daily'&&state.daily!==state.day&&Object.values(state.people).some(r=>r.last===state.day)){state.daily=state.day;add({gold:12});state.xp++;tell('日常奖励到账：12 金币。');return}
 if(a==='weekly'&&state.week!==week&&(state.weekHarvest?.[week]??0)>=3){state.week=week;add({gold:35,diamonds:1});state.xp++;tell('每周奖励到账：35 金币、1 钻石。');return}
 if(a==='award'&&!state.award&&state.total.built>=5){state.award=true;add({diamonds:2});tell('达成建设成就，获得 2 钻石。');return}
 if(a==='expand'){
  const zone=expansionAt(selected);
  if(zone&&canExpand(zone)){
   add(zone.cost,-1);state[zone.flag]=true;state.xp++;tell(zone.title+'开放了！');
  }
  return
 }
 if(a.startsWith('shop-buy-')){
  const id=a.slice(9), item=shopGoods[id];
  if(t?.type==='shop'&&item&&can({gold:item.price})){
   add({gold:-item.price,[id]:item.amount});
   tell('从溪谷商店购入 '+format({[id]:item.amount})+'。');
  }
  return
 }
 if(a==='invite'&&t?.type==='cottage'&&!state.people.rabbit){state.people.rabbit={bond:0,mood:75,last:0,job:null};person='rabbit';state.xp++;tell('栗栗搬进了蘑菇小屋。');return}
 if(a==='greet'&&p.last!==state.day){p.last=state.day;p.bond++;p.mood=Math.min(100,p.mood+5);add({joy:3});if(p.bond%4===0)add({stars:1});tell(who.name+'向你打招呼，快乐值 +3。');return}
 if(a==='gift'&&can({[who.gift]:1})&&p.giftDay!==state.day){p.giftDay=state.day;add({[who.gift]:1},-1);const before=Math.floor(p.bond/4);p.bond+=3;p.mood=Math.min(100,p.mood+12);add({joy:4,stars:Math.floor(p.bond/4)-before});tell(who.name+'很喜欢这份礼物，快乐值 +4。');return}
 if(a==='upgrade'&&d&&t.grade<3){
  const cost=upgradeCost(t);
  if(can(cost)){add(cost,-1);t.grade++;tell(d.name+'升到了 '+t.grade+' 级。')}
  return;
 }
 if(!d?.yield)return;
 const crew=t.crew??0;
 if(a.startsWith('labor-')){
  if(a==='labor-end'&&state.labor.royalSite===selected){
   state.labor.royalSite=null;
   tell('聂萌结束了'+d.name+'的劳动指令。');
  }
  if(a==='labor-supervise'||a==='labor-pressure'){
   const mode=a.slice(6);
   Object.assign(state.labor,{royalSite:selected,mode});
   tell('聂萌来到'+d.name+'，'+(mode==='pressure'?'要求加紧生产。指令持续期间，每收取一批都会降低民心。':'开始亲自督工。'));
  }
  return
 }
 if(a==='send-crew'&&crew<maxCrew&&idleRetinue()>=crewSize){
  t.crew=crew+crewSize;
  tell(crewSize+' 名王室奴仆已派驻'+d.name+'。');return
 }
 if(a==='recall-crew'&&crew>=crewSize){
  t.crew=crew-crewSize;
  tell(crewSize+' 名王室奴仆已返回梦想豪宅。');return
 }
 if(a==='start'&&d.input&&!planted(t)&&can(d.input)){add(d.input,-1);startBatch(t);tell(d.name+'开始制作，劳动进度已开始。');return}
 if(a==='speed'&&planted(t)&&!isReady(t)&&can({diamonds:1})){add({diamonds:1},-1);t.ready=state.day;tell('制作完成，可以收取了。');return}
 if(a==='assign'){
  const worker=Object.values(state.people).find(r=>r.job===selected);
  if(worker)worker.job=null;
  else if(person!=='hero')p.job=selected;
  else return;
  tell(worker?'居民已撤回。':who.name+'已开始工作，首项产物 +'+workerBonus(person)+'。');return
 }
  if(a==='harvest'&&isReady(t)){
  const adjacent=adjacentTiles(selected);
  const worker=Object.entries(state.people).find(([,resident])=>resident.job===selected);
  const bonus=Number(adjacent.some(i=>['flowers','fountain'].includes(state.tiles[i]?.type)))+(worker?workerBonus(worker[0]):0)+t.grade-1+crew/crewSize;
  const {royalSite,mode,morale}=state.labor;
  const royalBonus=royalSite===selected?royalYield[mode]:0;
  const pressed=royalSite===selected&&mode==='pressure';
  const penalty=morale<lowMorale?moralePenalty:0;
  const output={...d.yield},first=Object.keys(output)[0];
  output[first]=Math.max(1,output[first]+bonus+royalBonus+weatherBonus(t.type,selected)-penalty);
  add(output);state.xp++;state.total.harvest++;
  if(d.mood)Object.values(state.people).forEach(resident=>{resident.mood=Math.min(100,resident.mood+d.mood)});
  if(d.morale)adjustMorale(d.morale);
  if(pressed)adjustMorale(-pressureCost);
  state.weekHarvest??={};state.weekHarvest[week]=(state.weekHarvest[week]??0)+1;
  if(d.input){delete t.ready;delete t.batchStart;}else startBatch(t);
  tell('收获 '+format(output)+'。'+((pressed||d.morale)?' 劳动民心 '+morale+' → '+state.labor.morale+'。':'')+(d.mood?' 全体居民心情已恢复。':''));
 }
}
function advanceDay(days=1){
  state.day+=days;
  adjustMorale(4*days);
  if(state.people.rabbit)state.people.rabbit.mood=Math.max(35,state.people.rabbit.mood-2*days);
  tell('新的一天开始了，去看看有哪些产物可以收取。');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.id==='sleep'){advanceDay();return}
 if(b.dataset.tile!==undefined){tileClick(Number(b.dataset.tile));return}
 if(b.dataset.plan){movingBuilding=null;demolishingBuilding=null;plan=b.dataset.plan;selected=null;const d=catalog[plan];tell('准备建造'+d.name+'，请选择空地。');
  if(!isExploring()&&typeof window!=='undefined'&&window.matchMedia('(max-width: 760px)').matches)document.querySelector('.map-panel').scrollIntoView({block:'start'});
  return}
 if(b.dataset.action)act(b.dataset.action);
});
let batchesMigrated=false;
for(const t of Object.values(state.tiles)){
 if(planted(t)&&t.ready>state.day&&t.batchStart===undefined){
  t.batchStart=Date.now();batchesMigrated=true;
 }
}
const removedOldPalace=state.tiles[10]?.type==='hall';
if(removedOldPalace)delete state.tiles[10];
const terrainMigrated=buildTerrainCover();
if(installCitadel()||terrainMigrated||removedOldPalace||batchesMigrated||newClimate||newClock)save();
if(typeof location!=='undefined'){
 exploreMode=true;
 document.addEventListener('fullscreenchange',()=>{renderClimate();focusCamera();});
 window.addEventListener('resize',focusCamera);
 window.addEventListener('keydown',onExploreKey);
 window.addEventListener('keyup',event=>heldMoveKeys.delete(event.key.toLowerCase()));
 window.addEventListener('blur',()=>heldMoveKeys.clear());
 setupMapDrag();
 window.addEventListener('hashchange',()=>{
  syncWorkspace();
  window.scrollTo(0,0);
 });
 syncWorkspace();
}else render();
if(typeof setInterval==='function'){refreshDayClock();setInterval(refreshWorkProgress,500);setInterval(tickMotion,38);}
</script></body></html>
