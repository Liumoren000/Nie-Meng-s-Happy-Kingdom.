main{max-width:1580px}.layout:not(.build-layout){display:block}.layout:not(.build-layout) .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));margin-top:14px}.build-layout{grid-template-columns:minmax(0,1fr) minmax(285px,320px)}
.island-view{width:100%;padding:0;border:0;overflow:visible;background:#477b8e}.map#land-grid{width:100%;height:auto;aspect-ratio:1;overflow:visible}
.map#land-grid .island-tile{left:calc(var(--x) * 100% / 39);top:calc(var(--y) * 100% / 39);width:calc(100% / 39);height:calc(100% / 39);scroll-margin-top:58px}.map#land-grid .island-actor{left:calc((var(--x) + .19) * 100% / 39);top:calc((var(--y) + .16) * 100% / 39);width:calc(62% / 39);height:calc(62% / 39)}
.map-detail-drawer{position:fixed;z-index:8;right:16px;bottom:14px;width:min(370px,calc(100% - 32px));max-height:45dvh;overflow:auto;box-shadow:0 4px 20px #26372e44}.map-panel:fullscreen,.map-panel.map-overlay{display:flex;flex-direction:column;width:100%;height:100%;max-width:none;overflow:hidden;border:0;border-radius:0;background:#f6f0df}.map-panel.map-overlay{position:fixed;inset:0;z-index:100;height:100dvh}.map-panel:fullscreen .island-view,.map-panel.map-overlay .island-view{flex:1;min-height:0;display:grid;place-items:center;container-type:size}.map-panel:fullscreen .map#land-grid,.map-panel.map-overlay .map#land-grid{width:min(100cqw,100cqh);height:auto}.map-panel:fullscreen .map-supplies,.map-panel.map-overlay .map-supplies{display:none}
@media(max-width:760px){.build-layout{grid-template-columns:1fr}.map-detail-drawer{right:8px;bottom:8px;width:calc(100% - 16px)}}

.map#land-grid .island-tile,.map#land-grid .island-tile.water{background:transparent;box-shadow:none}
.map#land-grid .island-tile.locked{background:#273d2d2c}
.map#land-grid .island-tile.build-available{box-shadow:inset 0 0 0 1px #f8e6aaad}
.map#land-grid .island-tile:hover,.map#land-grid .island-tile.selected,.map#land-grid .island-tile:focus-visible{background:#faeec72e;box-shadow:inset 0 0 0 2px #fff0a9;z-index:3}
.map#land-grid .island-tile.weather-rain:after,.map#land-grid .island-tile.weather-snow:after{opacity:.56}

.walking-map .island-view{height:clamp(330px,62vh,680px);position:relative;overflow:hidden;background:#2c657d;display:block;container-type:normal}
.walking-map .map#land-grid{width:calc(max(100%,2730px)*var(--camera-zoom,1));height:auto;transform-origin:0 0;transition:transform .16s linear}
.walking-map .map#land-grid .island-actor{transition:left .14s linear,top .14s linear}
.walking-map .map#land-grid .facing-tile{box-shadow:inset 0 0 0 2px #f8e5a9ad;z-index:2}
.walking-map .map#land-grid .placement-preview{background:#f8ecae45;box-shadow:inset 0 0 0 3px #fff2aa}
.build-layout .walking-map .actor-toolbar{display:block}.walk-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.walk-controls .actions{margin-top:4px}.walk-controls .button{min-width:35px}.walk-controls p{margin:0}
.map-panel.walking-map:fullscreen .island-view,.map-panel.walking-map.map-overlay .island-view{display:block}
.map-panel.walking-map:fullscreen .map#land-grid,.map-panel.walking-map.map-overlay .map#land-grid{width:calc(max(100%,2730px)*var(--camera-zoom,1))}
@media(prefers-reduced-motion:reduce){.walking-map .map#land-grid{transition:none}}

.stage-hud{display:none}.button kbd{padding:1px 4px;background:#183832;border-radius:2px;color:#fff4cc}.map#land-grid .citadel-tile{z-index:3}.map#land-grid .citadel-tile .citadel-size{position:absolute;inset:-100%;z-index:1;pointer-events:none}.map#land-grid .citadel-tile .citadel-size .pixel-sprite{inset:0}.map#land-grid .citadel-tile:after{z-index:2}.map#land-grid .citadel-tile:hover{filter:brightness(1.06)}
body.game-stage{overflow:hidden;background:#2b483d}.game-stage>header,.game-stage main>.heading,.game-stage .realm-nav,.game-stage .footer,.game-stage .map-top,.game-stage #land-workspace>.side:not(:has(.map-detail-drawer)){display:none}.game-stage main{padding:0;max-width:none}.game-stage #land-workspace{display:block}.game-stage .map-panel{border:0;border-radius:0;box-shadow:none;height:100dvh;background:#2c657d;position:relative;overflow:hidden}.game-stage .map-panel .island-view{height:100%;max-height:none}.game-stage #land-workspace>.side{margin:0}.game-stage .side>*:not(.map-detail-drawer){display:none}.game-stage .map-panel .hint{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);min-height:0;width:max-content;max-width:84%;padding:5px 10px;border-radius:4px;background:#213830c9;color:#fff2c7;pointer-events:none;font-size:12px}.game-stage .map-panel>.map-supplies,.game-stage .map-panel>.climate-panel,.game-stage .map-panel>.actor-toolbar,.game-stage .map-panel:not(.stage-toast) .hint{display:none}
.game-stage .stage-hud{display:block;position:absolute;inset:0;pointer-events:none;z-index:6}.stage-top,.stage-hotbar,.stage-menu,.stage-dpad{pointer-events:auto;color:#fff5d2}.stage-top{display:flex;justify-content:space-between;align-items:start;padding:12px}.stage-date,.stage-hotbar,.stage-menu,.stage-dpad{background:#263b30ee;border:2px solid #b49358;box-shadow:0 3px #203429}.stage-date{padding:6px 11px;border-radius:3px}.stage-date small{display:block;color:#eddea6}.stage-hotbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:5px;white-space:nowrap}.stage-hotbar .button,.stage-dpad .button,.stage-menu .button{color:#263b2a}.stage-hotbar a,.stage-menu a{text-decoration:none}.stage-menu{position:absolute;right:12px;top:60px;width:min(380px,calc(100vw - 24px));padding:14px;border-radius:5px}.stage-menu h3{margin-bottom:8px}.stage-wallet{display:flex;gap:6px;flex-wrap:wrap}.stage-wallet span{padding:3px 5px;background:#ffffff12;border-radius:3px}.stage-dpad{display:none}@media(pointer:coarse){.stage-dpad{display:grid;position:absolute;bottom:66px;left:10px;grid-template-columns:repeat(2,38px);gap:2px;padding:4px}.stage-dpad .button{padding:3px}.game-stage .map-panel .hint{bottom:119px}}
@media(max-width:850px){.stage-hotbar .button{padding:6px 8px}}

.unified-shell[data-workspace=residents] #residents,.unified-shell[data-workspace=journal] #quest,.unified-shell[data-workspace=climate] #climate-panel{display:block;bottom:auto;max-height:calc(100dvh - 145px);width:min(520px,calc(100vw - 28px))}
.unified-shell[data-workspace=residents] .side,.unified-shell[data-workspace=journal] .side{display:block!important}.unified-shell #catalog-panel:not([hidden]){left:auto;right:14px;transform:none;width:min(330px,calc(100vw - 28px));bottom:auto;max-height:calc(100dvh - 145px);margin:0}
.unified-shell .map-detail-drawer{z-index:10;background:#f8ebc8;border:2px solid #896a42;bottom:69px}.unified-shell[data-workspace=build] .map-detail-drawer{right:auto;left:14px}.unified-shell .map-panel:not(.walking-map) .island-view{display:grid;place-items:center;container-type:size}.unified-shell .map-panel:not(.walking-map) #land-grid{width:min(100cqw,100cqh)}
.unified-shell .map-panel .island-view:after{content:'';position:absolute;pointer-events:none;inset:0;z-index:5;transition:background 1.4s linear}.unified-shell .map-panel[data-light="0"] .island-view:after{background:#eab66d12}.unified-shell .map-panel[data-light="1"] .island-view:after{background:transparent}.unified-shell .map-panel[data-light="2"] .island-view:after{background:#b8513438}.unified-shell .map-panel[data-light="3"] .island-view:after{background:#16244e6e}
@media(max-width:680px){.unified-shell #catalog-panel:not([hidden]){top:66px;max-height:36dvh;width:min(300px,calc(100vw - 28px))}.unified-shell[data-workspace=build] .map-detail-drawer{left:8px}.unified-shell #throne-workspace{padding:10px}}

.walking-map .island-view,.walking-map .island-view .island-tile{cursor:grab}.walking-map .island-view.map-dragging,.walking-map .island-view.map-dragging *{cursor:grabbing!important}.walking-map .island-view.map-dragging #land-grid{transition:none;user-select:none}.tier-preview{display:flex;gap:6px;margin:8px 0}.tier-sample{position:relative;width:62px;height:68px;background:#dfd1a5;border:1px solid #a48b55;border-radius:4px;text-align:center}.tier-sample .pixel-sprite{inset:3px 6px 16px}.tier-sample span:last-child{position:absolute;bottom:2px;left:0;right:0;font-size:11px}.tier-current{outline:2px solid #567b4a;background:#dbe6ad}
.map#land-grid .island-tile.weather-cloud:after{background:#3849651d}.map#land-grid .island-tile.weather-fog:after{background:linear-gradient(4deg,#e6efea77,#c1d6d329,transparent)}.map#land-grid .island-tile.weather-wind:after{background:repeating-linear-gradient(168deg,transparent 0 14px,#efdcb956 15px 16px,transparent 17px 29px);background-position:0 0;animation:windAcross 2.8s linear infinite}.map#land-grid .island-tile.weather-heat:after{background:linear-gradient(#efa8534b,#edb55a0a);animation:heatGlow 4s ease-in-out infinite alternate}.map#land-grid .island-tile.weather-dust:after{background:repeating-linear-gradient(170deg,#c6975938 0 12px,#e7b67833 13px 15px,transparent 16px 31px);animation:windAcross 3.3s linear infinite}.map#land-grid .island-tile.weather-storm:after{background:repeating-linear-gradient(123deg,#27385c33 0 10px,#c5deed83 11px 12px,#27385c33 13px 19px);background-size:38px 38px;animation:weatherFall 1s linear infinite,stormGlow 8s linear infinite}
@keyframes windAcross{to{background-position:132px 0}}@keyframes stormGlow{0%,92%,100%{opacity:.68}94%{opacity:.94}}@keyframes heatGlow{from{opacity:.4}to{opacity:.9}}

.map#land-grid .parcel-path{position:absolute;inset:0;pointer-events:none;z-index:0}.path-arm{position:absolute;background:#d8b379;box-shadow:inset 0 0 0 1px #99744a70}.path-east,.path-west{height:18%;top:41%;width:59%}.path-east{right:0}.path-west{left:0}.path-north,.path-south{width:18%;left:41%;height:59%}.path-north{top:0}.path-south{bottom:0}.path-arm:after{content:'';position:absolute;inset:2px;background:repeating-linear-gradient(90deg,#f0ce9033 0 3px,transparent 3px 10px);pointer-events:none}.path-north:after,.path-south:after{background:repeating-linear-gradient(#f0ce9033 0 3px,transparent 3px 10px)}
.lane-lamp{position:absolute;width:4%;height:19%;right:24%;top:27%;background:#503c38;z-index:2}.lane-lamp:before{content:'';position:absolute;width:270%;height:44%;left:-85%;top:0;background:#b19063;border:1px solid #513f39;box-sizing:border-box}.lane-lamp:after{content:'';position:absolute;inset:-11px -14px;opacity:0;background:radial-gradient(ellipse at 50% 28%,#ffe594b3,#f5c45a44 37%,transparent 69%);transition:opacity 1.4s;pointer-events:none}.map-panel[data-light="3"] .lane-lamp:after,.map-panel[data-light="2"] .lane-lamp:after{opacity:1}.map-panel[data-light="3"] .lane-lamp:before,.map-panel[data-light="2"] .lane-lamp:before{background:#ffeaa8;box-shadow:0 0 6px 2px #ffd868}
.stage-top-right{display:flex;gap:6px;align-items:start}.stage-location{text-align:right}.stage-location strong{white-space:nowrap}.stage-location small{white-space:nowrap}@media(max-width:480px){.stage-top-right{gap:3px}.stage-location{font-size:12px;padding:5px 7px}.stage-top .stage-close{max-width:89px;white-space:normal}}
.walking-map .island-view.map-zooming #land-grid{transition:none}

.map#land-grid .island-actor,.walking-map .map#land-grid .island-actor{transition:left var(--stride,180ms) linear,top var(--stride,180ms) linear}
.map#land-grid .island-actor .pixel-sprite{animation:none;transform:scaleX(var(--face,1))}.island-actor[data-face=west]{--face:-1}
.map#land-grid .island-actor.actor-walking .pixel-sprite{animation:pixelStride var(--stride,180ms) steps(1,end) infinite}
@keyframes pixelStride{0%,100%{transform:translateY(0) scaleX(var(--face,1))}50%{background-image:var(--step-frame);transform:translateY(-2px) scaleX(var(--face,1))}}
@media(prefers-reduced-motion:reduce){.map#land-grid .island-actor,.map#land-grid .island-actor .pixel-sprite{transition:none!important;animation:none!important}}

  if(now<step.next)continue;
  animalSteps.set(id,step);
  const origin=island[animal.home], current=actorPosition(id);

  });

 const initial=new Set([...clean].filter(id=>id>=mapWidth*mapHeight||(id<originalTiles&&id%mapWidth<6)));

  const todo=[frontier[0]];

  for(let i=0;i<todo.length&&targets.size;i++){
   for(const n of edges.get(todo[i])){

    reachable.add(n);targets.delete(n);todo.push(n);
   }

 }

  if(d.mood)Object.values(state.people).forEach(resident=>{resident.mood=Math.min(100,resident.mood+d.mood)});
  if(d.morale)adjustMorale(d.morale);
  if(pressed)adjustMorale(-pressureCost);
  state.weekHarvest??={};state.weekHarvest[week]=(state.weekHarvest[week]??0)+1;
  if(d.input){delete t.ready;delete t.batchStart;}else startBatch(t);
  tell('收获 '+format(output)+'。'+((pressed||d.morale)?' 劳动民心 '+morale+' → '+state.labor.morale+'。':'')+(d.mood?' 全体居民心情已恢复。':''));
 }
}
function advanceDay(days=1){
  state.day+=days;
  adjustMorale(4*days);
  if(state.people.rabbit)state.people.rabbit.mood=Math.max(35,state.people.rabbit.mood-2*days);
  tell('新的一天开始了，去看看有哪些产物可以收取。');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.id==='sleep'){advanceDay();return}
 if(b.dataset.tile!==undefined){tileClick(Number(b.dataset.tile));return}
 if(b.dataset.plan){movingBuilding=null;demolishingBuilding=null;plan=b.dataset.plan;selected=null;const d=catalog[plan];tell('准备建造'+d.name+'，请选择空地。');
  if(!isExploring()&&typeof window!=='undefined'&&window.matchMedia('(max-width: 760px)').matches)document.querySelector('.map-panel').scrollIntoView({block:'start'});
  return}
 if(b.dataset.action)act(b.dataset.action);
});
let batchesMigrated=false;
for(const t of Object.values(state.tiles)){
 if(planted(t)&&t.ready>state.day&&t.batchStart===undefined){
  t.batchStart=Date.now();batchesMigrated=true;
 }
}
const removedOldPalace=state.tiles[10]?.type==='hall';
if(removedOldPalace)delete state.tiles[10];
const terrainMigrated=buildTerrainCover();
if(installCitadel()||terrainMigrated||removedOldPalace||batchesMigrated||newClimate||newClock)save();
if(typeof location!=='undefined'){
 exploreMode=true;
 document.addEventListener('fullscreenchange',()=>{renderClimate();focusCamera();});
 window.addEventListener('resize',focusCamera);
 window.addEventListener('keydown',onExploreKey);
 window.addEventListener('keyup',event=>heldMoveKeys.delete(event.key.toLowerCase()));
 window.addEventListener('blur',()=>heldMoveKeys.clear());
 setupMapDrag();
 window.addEventListener('hashchange',()=>{
  syncWorkspace();
  window.scrollTo(0,0);
 });
 syncWorkspace();
}else render();
if(typeof setInterval==='function'){refreshDayClock();setInterval(refreshWorkProgress,500);setInterval(tickMotion,38);}
</script></body></html>
